name: "Build my-core-bot devcontainer image"

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - v2
      - 'event-*'
      - 'rush-*'

permissions:
  contents: read
  packages: write

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref_name }}-${{ steps.vars.outputs.sha }}'
  cancel-in-progress: true

jobs:
  checkout:
    runs-on: self-hosted
    env:
      PATH: "/vscode/vscode-server/bin/linux-x64/e7e037083ff4455cf320e344325dacb480062c3c/bin/remote-cli:/root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          ssh-key: ${{ secrets.SSH_KEY }}
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set vars
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./.github/workflows/my-core-bot-Dockerfile
          platforms: linux/amd64, linux/arm64
          push: true
          tags: |
            ghcr.io/42core-team/my-core-bot:${{ github.ref_name }}
            ghcr.io/42core-team/my-core-bot:${{ github.ref_name }}-${{ steps.vars.outputs.sha_short }}
